<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nerd Horoscope — Which Nerd Archetype Are You?</title>
<meta property="og:title" content="The Nerd Horoscope — Which Nerd Archetype Are You?">
<meta property="og:description" content="7 archetypes. 10 questions. Find your place in the Nerd Zodiac.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --theorist: #4F6BF6;
  --heart: #2ECC71;
  --realist: #F0A030;
  --engineer: #E74C3C;
  --romantic: #9B59B6;
  --observer: #1ABC9C;
  --force: #E84393;
  --bg: #0B0E17;
  --bg2: #141829;
  --text: #E8E6F0;
  --textdim: #8B8A97;
  --card: #1A1E30;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── STARFIELD ── */
.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.stars canvas { width: 100%; height: 100%; }

/* ── SECTIONS ── */
.section {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.section.active { display: flex; }

/* ── LANDING ── */
.landing-title {
  font-family: 'Space Mono', monospace;
  font-size: clamp(2rem, 6vw, 4rem);
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--theorist), var(--romantic), var(--force));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.landing-sub {
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  color: var(--textdim);
  text-align: center;
  margin-bottom: 48px;
  max-width: 520px;
  line-height: 1.6;
}

/* ── HOROSCOPE WHEEL ── */
.wheel-container {
  position: relative;
  width: min(500px, 85vw);
  height: min(500px, 85vw);
  margin: 0 auto 48px;
}

.wheel-svg {
  width: 100%; height: 100%;
  filter: drop-shadow(0 0 40px rgba(79, 107, 246, 0.15));
}

.wheel-segment { cursor: pointer; transition: transform 0.3s ease; }
.wheel-segment:hover { filter: brightness(1.2); }

.wheel-center-text {
  font-family: 'Space Mono', monospace;
  fill: var(--text);
  text-anchor: middle;
  dominant-baseline: central;
}

.wheel-label {
  font-family: 'Space Grotesk', sans-serif;
  fill: var(--text);
  text-anchor: middle;
  font-size: 13px;
  font-weight: 600;
  pointer-events: none;
}
.wheel-symbol {
  font-size: 26px;
  text-anchor: middle;
  pointer-events: none;
}
.wheel-element {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  fill: var(--textdim);
  text-anchor: middle;
  pointer-events: none;
}

/* ── ARCHETYPE TOOLTIP ── */
.archetype-tooltip {
  position: fixed;
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px 24px;
  max-width: 320px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.archetype-tooltip.visible { opacity: 1; pointer-events: auto; }
.archetype-tooltip h3 { font-size: 18px; margin-bottom: 4px; }
.archetype-tooltip .element-tag {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--textdim);
  margin-bottom: 10px;
}
.archetype-tooltip p { font-size: 14px; line-height: 1.5; color: var(--textdim); }
.archetype-tooltip .tip-chars {
  margin-top: 10px;
  font-size: 12px;
  color: var(--textdim);
  line-height: 1.6;
}
.archetype-tooltip .tip-chars span { color: var(--text); font-weight: 500; }

/* ── BUTTONS ── */
.btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  font-weight: 600;
  padding: 16px 48px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--theorist), var(--romantic));
  color: white;
  box-shadow: 0 4px 24px rgba(79, 107, 246, 0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(79, 107, 246, 0.5);
}
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.15);
}
.btn-secondary:hover { border-color: rgba(255,255,255,0.3); }
.btn-small { font-size: 14px; padding: 10px 28px; }

/* ── QUIZ ── */
.quiz-container {
  max-width: 640px;
  width: 100%;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--bg2);
  border-radius: 2px;
  margin-bottom: 48px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--theorist), var(--romantic));
  border-radius: 2px;
  transition: width 0.5s ease;
}
.question-number {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--textdim);
  margin-bottom: 12px;
}
.question-text {
  font-size: clamp(1.2rem, 3vw, 1.6rem);
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 36px;
}
.answers { display: flex; flex-direction: column; gap: 12px; }
.answer-btn {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 18px 24px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
  transition: all 0.25s ease;
  line-height: 1.4;
}
.answer-btn:hover {
  border-color: var(--theorist);
  background: rgba(79, 107, 246, 0.08);
  transform: translateX(4px);
}
.answer-btn.selected {
  border-color: var(--theorist);
  background: rgba(79, 107, 246, 0.15);
}

/* ── RESULT ── */
.result-container {
  max-width: 560px;
  width: 100%;
  text-align: center;
}
.result-card {
  background: var(--card);
  border-radius: 24px;
  padding: 48px 36px;
  margin-bottom: 32px;
  border: 1px solid rgba(255,255,255,0.08);
  position: relative;
  overflow: hidden;
}
.result-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--result-color, var(--theorist));
}
.result-badge {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--textdim);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 16px;
}
.result-symbol { font-size: 64px; margin-bottom: 16px; }
.result-name {
  font-family: 'Space Mono', monospace;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 700;
  margin-bottom: 4px;
}
.result-element {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--textdim);
  margin-bottom: 24px;
}
.result-desc {
  font-size: 17px;
  line-height: 1.7;
  color: var(--textdim);
  margin-bottom: 28px;
}
.result-traits {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
}
.trait-tag {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
}

/* ── FAMOUS CHARACTERS SECTION ── */
.famous-section {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 24px;
  margin-top: 8px;
  margin-bottom: 24px;
}
.famous-section h4 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--textdim);
  margin-bottom: 16px;
}
.famous-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.famous-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--text);
  transition: all 0.2s;
}
.famous-chip:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.15);
}
.famous-chip .chip-show {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--textdim);
}

/* ── COMPATIBILITY ── */
.result-compat {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 20px;
  margin-top: 8px;
}
.result-compat h4 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--textdim);
  margin-bottom: 12px;
}
.compat-pair {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0 8px;
  font-size: 15px;
}
.compat-pair .compat-icon { font-size: 22px; }

.result-axes {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 24px 0;
}
.axis-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--textdim);
}
.axis-label { width: 80px; text-align: right; font-family: 'Space Mono', monospace; }
.axis-label-r { width: 80px; text-align: left; font-family: 'Space Mono', monospace; }
.axis-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.axis-fill {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  border-radius: 3px;
  transition: width 1s ease;
}

.share-section { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }

/* ── WHEEL ON RESULT ── */
.result-wheel-wrap {
  margin: 24px auto;
  width: min(320px, 80vw);
  height: min(320px, 80vw);
}
.result-wheel-wrap svg { filter: drop-shadow(0 0 20px rgba(79,107,246,0.1)); }
.pulse-glow {
  animation: pulseGlow 2s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* ── CHALLENGE SECTION ── */
.challenge-box {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 28px;
  margin-top: 24px;
  text-align: center;
}
.challenge-box h3 { font-size: 18px; margin-bottom: 8px; }
.challenge-box p { font-size: 14px; color: var(--textdim); margin-bottom: 16px; line-height: 1.5; }
.challenge-link {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  background: var(--bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--text);
  width: 100%;
  text-align: center;
  cursor: pointer;
  user-select: all;
}

/* ── EXPLORE SECTION ── */
.explore-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  max-width: 900px;
  width: 100%;
  margin-top: 32px;
}
.explore-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
}
.explore-card:hover {
  transform: translateY(-4px);
  border-color: rgba(255,255,255,0.2);
}
.explore-card .ex-symbol { font-size: 36px; margin-bottom: 10px; }
.explore-card .ex-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.explore-card .ex-element {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--textdim);
  margin-bottom: 12px;
}
.explore-card .ex-chars {
  font-size: 13px;
  color: var(--textdim);
  line-height: 1.6;
}
.explore-card .ex-chars strong { color: var(--text); font-weight: 500; }

/* ── ARCHETYPE DETAIL ── */
.detail-container {
  max-width: 600px;
  width: 100%;
  text-align: center;
}
.detail-chars-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin: 20px 0;
  text-align: left;
}
.detail-char-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 14px 16px;
}
.detail-char-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.detail-char-show {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--textdim);
  margin-bottom: 6px;
}
.detail-char-why {
  font-size: 12px;
  color: var(--textdim);
  line-height: 1.5;
}

/* ── ANIMATIONS ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeInUp 0.6s ease forwards; }
.fade-in-delay { animation: fadeInUp 0.6s ease 0.2s forwards; opacity: 0; }
.fade-in-delay2 { animation: fadeInUp 0.6s ease 0.4s forwards; opacity: 0; }

/* ── RESPONSIVE ── */
@media (max-width: 500px) {
  .section { padding: 24px 16px; }
  .result-card { padding: 32px 20px; }
  .btn { padding: 14px 36px; font-size: 16px; }
  .detail-chars-grid { grid-template-columns: 1fr; }
}
</style>
</head>

</section>

// ── STARFIELD ──
function initStars() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [];
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function createStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.0005 + 0.0002,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    stars.forEach(s => {
      const twinkle = Math.sin(t * s.speed * 1000 + s.phase) * 0.3 + 0.7;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 200, 255, ${s.a * twinkle})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); createStars(); requestAnimationFrame(draw);
  window.addEventListener('resize', () => { resize(); createStars(); });
}

// ── SVG WHEEL ──
function buildWheel(container, size, highlightKey, interactive) {
  const keys = Object.keys(ARCHETYPES);
  const cx = size / 2, cy = size / 2;
  const outerR = size * 0.42, innerR = size * 0.22, labelR = size * 0.335;

  let svg = `<svg class="wheel-svg" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<defs>`;
  keys.forEach(k => {
    svg += `<radialGradient id="glow-${k}-${size}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${ARCHETYPES[k].color}" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="${ARCHETYPES[k].color}" stop-opacity="0"/>
    </radialGradient>`;
  });
  svg += `</defs>`;

  const segAngle = (2 * Math.PI) / keys.length;
  const startOffset = -Math.PI / 2 - segAngle / 2;

  keys.forEach((k, i) => {
    const a = ARCHETYPES[k];
    const a1 = startOffset + i * segAngle;
    const a2 = a1 + segAngle;
    const mid = (a1 + a2) / 2;
    const isHighlighted = highlightKey === k;
    const opacity = highlightKey ? (isHighlighted ? 0.35 : 0.12) : 0.2;

    const x1o = cx + outerR * Math.cos(a1), y1o = cy + outerR * Math.sin(a1);
    const x2o = cx + outerR * Math.cos(a2), y2o = cy + outerR * Math.sin(a2);
    const x1i = cx + innerR * Math.cos(a2), y1i = cy + innerR * Math.sin(a2);
    const x2i = cx + innerR * Math.cos(a1), y2i = cy + innerR * Math.sin(a1);

    svg += `<path class="wheel-segment" data-key="${k}"
      d="M${x1o},${y1o} A${outerR},${outerR} 0 0,1 ${x2o},${y2o}
         L${x1i},${y1i} A${innerR},${innerR} 0 0,0 ${x2i},${y2i} Z"
      fill="${a.color}" fill-opacity="${opacity}" stroke="${a.color}" stroke-opacity="0.4" stroke-width="1"/>`;

    if (isHighlighted) {
      svg += `<circle cx="${cx + labelR * Math.cos(mid)}" cy="${cy + labelR * Math.sin(mid)}"
        r="${size * 0.08}" fill="url(#glow-${k}-${size})" class="pulse-glow"/>`;
    }

    const sx = cx + (labelR - 12) * Math.cos(mid);
    const sy = cy + (labelR - 12) * Math.sin(mid);
    svg += `<text class="wheel-symbol" x="${sx}" y="${sy}" dy="-2">${a.symbol}</text>`;

    const lx = cx + (labelR + 14) * Math.cos(mid);
    const ly = cy + (labelR + 14) * Math.sin(mid);
    svg += `<text class="wheel-label" x="${lx}" y="${ly}" dy="1" fill="${isHighlighted ? a.color : '#E8E6F0'}">${a.name.replace('The ', '')}</text>`;

    const ex = cx + (labelR + 28) * Math.cos(mid);
    const ey = cy + (labelR + 28) * Math.sin(mid);
    svg += `<text class="wheel-element" x="${ex}" y="${ey}" dy="1">${a.elementIcon} ${a.element}</text>`;
  });

  // Compatibility lines
  if (!highlightKey) {
    keys.forEach((k, i) => {
      const a = ARCHETYPES[k];
      const bestIdx = keys.indexOf(a.bestMatch);
      if (bestIdx > i) {
        const a1 = startOffset + i * segAngle + segAngle / 2;
        const a2s = startOffset + bestIdx * segAngle + segAngle / 2;
        const x1 = cx + innerR * 0.9 * Math.cos(a1), y1 = cy + innerR * 0.9 * Math.sin(a1);
        const x2 = cx + innerR * 0.9 * Math.cos(a2s), y2 = cy + innerR * 0.9 * Math.sin(a2s);
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,4"/>`;
      }
    });
  }

  svg += `<circle cx="${cx}" cy="${cy}" r="${innerR - 4}" fill="${highlightKey ? ARCHETYPES[highlightKey].color : '#4F6BF6'}" fill-opacity="0.06" stroke="${highlightKey ? ARCHETYPES[highlightKey].color : '#4F6BF6'}" stroke-opacity="0.2" stroke-width="1"/>`;
  if (highlightKey) {
    svg += `<text class="wheel-center-text" x="${cx}" y="${cy}" font-size="32">${ARCHETYPES[highlightKey].symbol}</text>`;
  } else {
    svg += `<text class="wheel-center-text" x="${cx}" y="${cy - 8}" font-size="10" fill="#8B8A97" letter-spacing="2">YOUR</text>`;
    svg += `<text class="wheel-center-text" x="${cx}" y="${cy + 10}" font-size="12" font-weight="600" letter-spacing="1">ARCHETYPE</text>`;
  }

  svg += `</svg>`;
  container.innerHTML = svg;

  if (interactive) {
    container.querySelectorAll('.wheel-segment').forEach(seg => {
      seg.addEventListener('mouseenter', e => showTooltip(seg.dataset.key, e));
      seg.addEventListener('mouseleave', hideTooltip);
      seg.addEventListener('click', e => showTooltip(seg.dataset.key, e));
    });
  }
}

// ── TOOLTIP ──
function showTooltip(key, e) {
  const a = ARCHETYPES[key];
  const tip = document.getElementById('tooltip');
  const charNames = a.characters.slice(0, 4).map(c => `<span>${c.name}</span>`).join(' · ');
  tip.innerHTML = `
    <h3 style="color:${a.color}">${a.symbol} ${a.name}</h3>
    <div class="element-tag">${a.elementIcon} Element of ${a.element}</div>
    <p>${a.tagline}</p>
    <div class="tip-chars">Also known as: ${charNames}</div>
  `;
  let x = e.clientX + 16, y = e.clientY - 20;
  if (x + 340 > window.innerWidth) x = e.clientX - 340;
  if (y + 200 > window.innerHeight) y = e.clientY - 200;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip.classList.add('visible');
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

          ${a.characters.map(c => `
            <div class="detail-char-card">
              <div class="detail-char-name">${c.name}</div>
              <div class="detail-char-show">${c.show}</div>
              <div class="detail-char-why">${c.why}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="result-compat">
        <h4>Cosmic Compatibility</h4>
        <div style="margin-bottom:8px;">
          <span class="compat-pair"><span class="compat-icon">${best.symbol}</span> ${best.name}</span>
          <span style="font-size:12px;color:var(--textdim)">— best match</span>
        </div>
        <div style="margin-bottom:8px;">
          <span class="compat-pair"><span class="compat-icon">${also.symbol}</span> ${also.name}</span>
          <span style="font-size:12px;color:var(--textdim)">— great energy</span>
        </div>
        <div>
          <span class="compat-pair"><span class="compat-icon">${tension.symbol}</span> ${tension.name}</span>
          <span style="font-size:12px;color:var(--textdim)">— creative tension</span>
        </div>
      </div>
    </div>

    <div class="result-card fade-in-delay" style="--result-color:${a.color}; padding:28px 24px;">
      <div class="result-badge">Today's Nerd Horoscope</div>
      <p style="font-size:15px;line-height:1.7;color:var(--textdim);margin-top:12px;">${a.horoscope}</p>
    </div>

    <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn btn-primary" onclick="startQuiz()">Take the Quiz</button>
      <button class="btn btn-secondary btn-small" onclick="showExplore()">Back to Zodiac</button>
    </div>
  `;
  showSection('sec-detail');
}

// ── QUIZ ──
function startQuiz() {
  currentQ = 0;
  scores = [0.5, 0.5, 0.5, 0.5, 0.5];
  showSection('sec-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  document.getElementById('progress-fill').style.width = ((currentQ) / QUESTIONS.length * 100) + '%';
  document.getElementById('q-number').textContent = `Question ${currentQ + 1} of ${QUESTIONS.length}`;
  document.getElementById('q-text').textContent = q.text;

  const answersEl = document.getElementById('q-answers');
  answersEl.innerHTML = '';

  const shuffled = q.answers.map((a, i) => ({...a, origIdx: i}));
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  shuffled.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = ans.text;
    btn.style.animationDelay = (i * 0.08) + 's';
    btn.addEventListener('click', () => selectAnswer(ans.scores));
    answersEl.appendChild(btn);
  });
}

function selectAnswer(ansScores) {
  for (let i = 0; i < 5; i++) {
    scores[i] = Math.max(0, Math.min(1, scores[i] + ansScores[i]));
  }
  currentQ++;
  if (currentQ >= QUESTIONS.length) {
    document.getElementById('progress-fill').style.width = '100%';
    const result = calculateResult();
    setTimeout(() => showResult(result), 400);
  } else {
    renderQuestion();
  }
}

function calculateResult() {
  let bestKey = '', bestDist = Infinity;
  Object.entries(ARCHETYPES).forEach(([k, a]) => {
    let dist = 0;
    for (let i = 0; i < 5; i++) {
      dist += Math.pow(scores[i] - a.axes[i], 2);
    }
    if (dist < bestDist) { bestDist = dist; bestKey = k; }
  });
  return bestKey;
}

// ── RESULT ──
function showResult(key) {
  const a = ARCHETYPES[key];
  const best = ARCHETYPES[a.bestMatch];
  const also = ARCHETYPES[a.alsoGood];
  const tension = ARCHETYPES[a.tension];

  // Store archetype
  try { localStorage.setItem('nerdArchetype', key); } catch(e) {}

  const rc = document.getElementById('result-container');
  rc.innerHTML = `
    <div class="result-card fade-in" style="--result-color:${a.color}">
      <div class="result-badge">Your Nerd Archetype</div>
      <div class="result-symbol">${a.symbol}</div>
      <div class="result-name" style="color:${a.color}">${a.name}</div>
      <div class="result-element">${a.elementIcon} Element of ${a.element}</div>
      <div class="result-desc">${a.description}</div>
      <div class="result-traits">
        ${a.traits.map(t => `<span class="trait-tag" style="border-color:${a.color}44">${t}</span>`).join('')}
      </div>

      <div class="famous-section">
        <h4>You're in Good Company</h4>
        <div class="famous-grid">
          ${a.characters.map(c => `
            <div class="famous-chip">
              <span>${c.name}</span>
              <span class="chip-show">${c.show}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="result-axes" id="result-axes"></div>

      <div class="result-compat">
        <h4>Cosmic Compatibility</h4>
        <div style="margin-bottom:8px;">
          <span class="compat-pair"><span class="compat-icon">${best.symbol}</span> ${best.name}</span>
          <span style="font-size:12px;color:var(--textdim)">— best match</span>
        </div>
        <div style="margin-bottom:8px;">
          <span class="compat-pair"><span class="compat-icon">${also.symbol}</span> ${also.name}</span>
          <span style="font-size:12px;color:var(--textdim)">— great energy</span>
        </div>
        <div>
          <span class="compat-pair"><span class="compat-icon">${tension.symbol}</span> ${tension.name}</span>
          <span style="font-size:12px;color:var(--textdim)">— creative tension</span>
        </div>
      </div>
    </div>

    <div class="result-card fade-in-delay" style="--result-color:${a.color}; padding:28px 24px;">
      <div class="result-badge">Today's Nerd Horoscope</div>
      <p style="font-size:15px;line-height:1.7;color:var(--textdim);margin-top:12px;">${a.horoscope}</p>
    </div>

    <div class="result-wheel-wrap fade-in-delay" id="result-wheel"></div>

    <div class="share-section fade-in-delay2">
      <button class="btn btn-primary" onclick="shareResult('${key}')">Share My Archetype</button>
      <button class="btn btn-secondary btn-small" onclick="startQuiz()">Retake Quiz</button>
      <button class="btn btn-secondary btn-small" onclick="showSection('sec-landing')">Home</button>
    </div>

    <div class="challenge-box fade-in-delay2">
      <h3>Challenge Your Friends</h3>
      <p>I'm <strong style="color:${a.color}">${a.name}</strong> — like ${a.characters[0].name} and ${a.characters[1].name}.<br>Which nerd are you?</p>
      <div class="challenge-link" onclick="copyLink(this)">
        ${window.location.href.split('?')[0]} — tap to copy
      </div>
    </div>
  `;

  // Build axes
  const axesEl = document.getElementById('result-axes');
  if (axesEl) {
    axesEl.innerHTML = AXIS_LABELS.map((labels, i) => {
      const pct = Math.round(scores[i] * 100);
      return `<div class="axis-row">
        <span class="axis-label">${labels[0]}</span>
        <div class="axis-bar">
          <div class="axis-fill" style="width:${pct}%;background:${a.color}"></div>
        </div>
        <span class="axis-label-r">${labels[1]}</span>
      </div>`;
    }).join('');
  }

  // Build result wheel
  setTimeout(() => {
    const wheelWrap = document.getElementById('result-wheel');
    if (wheelWrap) buildWheel(wheelWrap, 320, key, false);
  }, 100);

  showSection('sec-result');
}

async function shareResult(key) {
  const a = ARCHETYPES[key];
  const topChars = a.characters.slice(0, 2).map(c => c.name).join(' and ');
  const shareText = `I'm ${a.name} ${a.symbol} — like ${topChars}. Which nerd archetype are you?`;
  const shareUrl = window.location.href.split('?')[0];

  if (navigator.share) {
    try {
      await navigator.share({ title: 'The Nerd Horoscope', text: shareText, url: shareUrl });
    } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(shareText + '\n' + shareUrl);
      alert('Copied to clipboard!');
    } catch(e) {
      prompt('Copy this:', shareText + '\n' + shareUrl);
    }
  }
}

function copyLink(el) {
  const url = window.location.href.split('?')[0];
  navigator.clipboard.writeText(url).then(() => {
    el.textContent = 'Copied!';
    setTimeout(() => { el.textContent = url + ' — tap to copy'; }, 2000);
  });
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  initStars();
  buildWheel(document.getElementById('main-wheel'), 500, null, true);
});
</script>
